<path d="M14 49 C12 41 18 37 25 37 C32 37 36 34 36 29 C36 24 31 22 27 24 C29 18 38 17 42 22 C46 27 44 36 36 40 C30 43 22 42 20 46 C19 48 17 50 14 49 Z"/>
